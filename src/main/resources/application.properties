spring.application.name=seat-reservation

# Local defaults; override these environment variables when deploying.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema changes will be managed explicitly rather than generated by Hibernate.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
