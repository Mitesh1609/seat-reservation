spring.application.name=seat-reservation

# Local defaults; override these environment variables when deploying.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema changes; Hibernate only verifies that entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Emit machine-readable JSON logs. Request fields added through MDC are
# included as top-level fields in each log event.
logging.structured.format.console=logstash

# Health probes for deployment platforms. Readiness includes PostgreSQL;
# liveness only reports the application's internal availability state.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# All instances must use the same externally provisioned signing keys and claims.
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.issuer=${JWT_ISSUER:seat-reservation}
app.jwt.audience=${JWT_AUDIENCE:seat-reservation-api}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
